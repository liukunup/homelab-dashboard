apiVersion: 1
groups:
  - orgId: 1
    name: example-group
    folder: General
    interval: 60s
    rules:
      - uid: my-alert-uid
        title: High CPU Usage
        condition: B
        data:
          - refId: A
            datasourceUid: <prometheus-datasource-uid>
            model: ...
          - refId: B
            model:
              conditions:
                - evaluator:
                    params: [80]
                    type: gt